apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: data
spec:
  selector:
    app: cassandra
  ports:
  - name: tcp
    port: 9042
    targetPort: 9042
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      automountServiceAccountToken: false
      containers:
      - name: cassandra
        image: cassandra:4.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9042
        resources:
          requests:
            cpu: 50m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1200Mi
        readinessProbe:
          tcpSocket:
            port: 9042
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 9042
          failureThreshold: 120
          periodSeconds: 5
        command:
        - bash
        - -ec
        - 'sed -ri ''s/^authenticator:.*/authenticator: PasswordAuthenticator/; s/^authorizer:.*/authorizer:
          CassandraAuthorizer/'' /etc/cassandra/cassandra.yaml; exec docker-entrypoint.sh
          cassandra -f'
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: ubi060
        - name: CASSANDRA_DC
          value: dc1
        - name: CASSANDRA_ENDPOINT_SNITCH
          value: GossipingPropertyFileSnitch
        - name: CASSANDRA_SEEDS
          value: cassandra-0.cassandra.data.svc.cluster.local
        - name: MAX_HEAP_SIZE
          value: 512M
        - name: HEAP_NEWSIZE
          value: 100M
        volumeMounts:
        - name: storage
          mountPath: /var/lib/cassandra
  serviceName: cassandra
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
