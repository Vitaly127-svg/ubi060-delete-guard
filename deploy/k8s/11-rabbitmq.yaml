apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pattern
spec:
  selector:
    app: rabbitmq
  ports:
  - name: tcp
    port: 5672
    targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1-management-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 5672
          failureThreshold: 120
          periodSeconds: 5
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: ubi060
        - name: RABBITMQ_DEFAULT_VHOST
          value: ubi060
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: infrastructure
              key: rabbit-password
        volumeMounts:
        - name: storage
          mountPath: /var/lib/rabbitmq
  serviceName: rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
