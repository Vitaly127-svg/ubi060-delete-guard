apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: pattern
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: cleanup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
          - name: cleanup
            image: ubi060:dev
            command:
            - python
            - scripts/cleanup.py
            volumeMounts:
            - name: config
              mountPath: /run/config
              readOnly: true
          volumes:
          - name: config
            secret:
              secretName: cleanup-config
