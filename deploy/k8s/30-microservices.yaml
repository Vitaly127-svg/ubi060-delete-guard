apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pattern
spec:
  selector:
    app: auth-service
  ports:
  - name: tcp
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      automountServiceAccountToken: false
      containers:
      - name: auth-service
        image: ubi060:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8001
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 8001
          failureThreshold: 120
          periodSeconds: 5
        env:
        - name: SERVICE
          value: auth-service
        - name: PORT
          value: '8001'
        - name: SECRET_DIR
          value: /run/config
        volumeMounts:
        - name: config
          mountPath: /run/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          periodSeconds: 10
      volumes:
      - name: config
        secret:
          secretName: auth-service-config
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
