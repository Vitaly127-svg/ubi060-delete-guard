apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: pattern
data:
  nginx.conf: "worker_processes auto;\npid /tmp/nginx.pid;\nerror_log /dev/stderr\
    \ warn;\nevents { worker_connections 1024; }\nhttp {\n    access_log /dev/stdout;\n\
    \    client_max_body_size 1m;\n    client_body_temp_path /tmp/client_temp;\n \
    \   proxy_temp_path /tmp/proxy_temp;\n    limit_req_zone $binary_remote_addr zone=api:10m\
    \ rate=10r/s;\n    limit_req_status 429;\n    server {\n        listen 8443 ssl;\n\
    \        ssl_certificate /etc/tls/tls.crt;\n        ssl_certificate_key /etc/tls/tls.key;\n\
    \        ssl_protocols TLSv1.2 TLSv1.3;\n        location = /healthz { access_log\
    \ off; return 200 'alive'; }\n        location = /token {\n            limit_req\
    \ zone=api burst=10 nodelay;\n            proxy_pass http://auth-service.pattern.svc.cluster.local:8001;\n\
    \        }\n        location = /_verify {\n            internal;\n           \
    \ proxy_pass http://auth-service.pattern.svc.cluster.local:8001/verify;\n    \
    \        proxy_pass_request_body off;\n            proxy_set_header Content-Length\
    \ \"\";\n            proxy_set_header Authorization $http_authorization;\n   \
    \     }\n        location / {\n            limit_req zone=api burst=20 nodelay;\n\
    \            auth_request /_verify;\n            proxy_set_header Authorization\
    \ $http_authorization;\n            proxy_set_header X-User \"\";\n          \
    \  proxy_set_header X-Role \"\";\n            proxy_pass http://data-api.data.svc.cluster.local:8000;\n\
    \        }\n        location ~ ^/(deletions|policies|dependencies|catalog)(/|$)\
    \ {\n            limit_req zone=api burst=20 nodelay;\n            auth_request\
    \ /_verify;\n            proxy_set_header Authorization $http_authorization;\n\
    \            proxy_set_header X-User \"\";\n            proxy_set_header X-Role\
    \ \"\";\n            proxy_pass http://delete-guard.pattern.svc.cluster.local:8002;\n\
    \        }\n        location /quarantine {\n            limit_req zone=api burst=20\
    \ nodelay;\n            auth_request /_verify;\n            proxy_set_header Authorization\
    \ $http_authorization;\n            proxy_pass http://quarantine-service.pattern.svc.cluster.local:8003;\n\
    \        }\n        location ~ ^/(audit|notifications)(/|$) {\n            limit_req\
    \ zone=api burst=20 nodelay;\n            auth_request /_verify;\n           \
    \ proxy_set_header Authorization $http_authorization;\n            proxy_pass\
    \ http://audit-service.pattern.svc.cluster.local:8004;\n        }\n    }\n}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: pattern
spec:
  selector:
    app: nginx-gateway
  ports:
  - name: tcp
    port: 8443
    targetPort: 8443
    nodePort: 30443
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: pattern
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx-gateway
        image: nginx:1.28-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8443
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 8443
          failureThreshold: 120
          periodSeconds: 5
        command:
        - nginx
        - -c
        - /etc/ubi060/nginx.conf
        - -g
        - daemon off;
        volumeMounts:
        - name: nginx
          mountPath: /etc/ubi060
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx
        configMap:
          name: nginx
      - name: tls
        secret:
          secretName: gateway-tls
      - name: tmp
        emptyDir: {}
