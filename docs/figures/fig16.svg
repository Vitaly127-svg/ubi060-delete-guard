chor="middle" dominant-baseline="central">Оставить событие</text><text x="940.0" y="706.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">в outbox для повтора</text><text x="350.0" y="678.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Пометить событие опубликованным;</text><text x="350.0" y="711.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">потребитель получает сообщение</text><text x="350.0" y="888.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">event_id уже есть</text><text x="350.0" y="921.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">в audit_log?</text><text x="350.0" y="1093.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Записать журнал с хешем</text><text x="350.0" y="1126.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">и уведомление; COMMIT</text><text x="820.0" y="1330.0" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Подтвердить сообщение ACK</text><text x="720" y="470.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">[нет]</text><text x="430" y="600.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">[да]</text><text x="430" y="1010.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">[нет]</text><text x="720" y="880.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">[да]</text></svg>