anchor="middle" dominant-baseline="central">Начать транзакцию;</text><text x="350.0" y="326.52000000000004" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">заблокировать каталог</text><text x="350.0" y="473.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Ключ запроса</text><text x="350.0" y="506.52000000000004" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">уже сохранён?</text><text x="950.0" y="673.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Вернуть прежнее решение</text><text x="950.0" y="706.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">или 409 при конфликте ключа</text><text x="350.0" y="673.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Прочитать эталон, политику,</text><text x="350.0" y="706.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">граф связей и счётчик</text><text x="350.0" y="883.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Правила R1–R4</text><text x="350.0" y="916.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">выполнены?</text><text x="350.0" y="1094.07" font-family="Arial" font-size="27" text-anchor="middle" dominant-baseline="central">R5 и срок хранения</text><text x="350.0" y="1125.9299999999998" font-family="Arial" font-size="27" text-anchor="middle" dominant-baseline="central">подтверждены?</text><text x="950.0" y="1093.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">403: состояние ACTIVE;</text><text x="950.0" y="1126.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">событие blocked</text><text x="220.0" y="1313.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">202: QUARANTINED;</text><text x="220.0" y="1346.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">событие quarantined</text><text x="650.0" y="1313.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">409: DEFERRED;</text><text x="650.0" y="1346.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">событие deferred</text><text x="600.0" y="1503.48" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Записать состояние, outbox</text><text x="600.0" y="1536.52" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">и результат запроса; COMMIT</text><text x="600.0" y="1690.0" font-family="Arial" font-size="28" text-anchor="middle" dominant-baseline="central">Конец</text><text x="430" y="600.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">нет</text><text x="430" y="1005.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">да</text><text x="740" y="465.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">да</text><text x="740" y="875.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">нет</text><text x="430" y="1220.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">да</text><text x="700" y="1200.0" font-family="Arial" font-size="25" text-anchor="middle" dominant-baseline="central">нет</text></svg>